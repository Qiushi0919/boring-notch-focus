  <h1>Boring Notch Focus</h1>
  <p>带番茄钟、音乐双播放源、日历和文件岛增强功能的 Boring Notch 定制版。</p>
  <p><a href="https://github.com/Qiushi0919/boring-notch-focus/releases/latest/download/Boring-Notch-Focus.dmg">下载最新版 DMG</a></p>
  <h2>首次安装</h2>
  <ol>
    <li>打开 DMG。</li>
    <li>把“Boring Notch Focus”拖到“Applications/应用程序”，不要直接在 DMG 中运行。</li>
    <li>从“应用程序”启动，并按提示授予需要的日历、提醒事项和辅助功能权限。</li>
  </ol>
  <p>如果 macOS 首次拦截应用，请在“系统设置 → 隐私与安全性”中选择“仍要打开”。</p>
  <p>完成首次安装后，后续版本将由应用内置的 Sparkle 更新器自动推送，不必再次下载 DMG。</p>
